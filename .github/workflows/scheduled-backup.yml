# Optional: triggers your site's scheduled backup from GitHub (works for ANY host).
# 1. In your site's environment set CRON_SECRET (16+ random characters) and turn on a schedule in Admin → Backups.
# 2. In GitHub → Settings → Secrets and variables → Actions add:  SITE_URL (https://your-domain)  and  CRON_SECRET.
# The site only makes a backup when one is due, so a daily trigger is enough for daily/weekly/monthly schedules.
name: Scheduled backup trigger
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/backup
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL / CRON_SECRET secrets not set — skipping."; exit 0; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/backup"
